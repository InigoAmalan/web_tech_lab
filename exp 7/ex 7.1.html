
<!DOCTYPE html>
<html>
<head>
    <title>jQuery Calculator</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }
        input {
            padding: 8px;
            margin: 5px;
            width: 150px;
        }
        button {
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            font-size: 20px;
            color: blue;
        }
    </style>

    <script>
        $(document).ready(function() {

            $("#add").click(function() {
                let a = Number($("#num1").val());
                let b = Number($("#num2").val());
                $("#result").text("Result: " + (a + b));
            });

            $("#sub").click(function() {
                let a = Number($("#num1").val());
                let b = Number($("#num2").val());
                $("#result").text("Result: " + (a - b));
            });

            $("#mul").click(function() {
                let a = Number($("#num1").val());
                let b = Number($("#num2").val());
                $("#result").text("Result: " + (a * b));
            });

            $("#div").click(function() {
                let a = Number($("#num1").val());
                let b = Number($("#num2").val());

                if (b === 0) {
                    $("#result").text("Cannot divide by zero");
                } else {
                    $("#result").text("Result: " + (a / b));
                }
            });

        });
    </script>
</head>

<body>
    <h2>URK24CS1128</h2>

    <h2>jQuery Calculator</h2>

    <input type="number" id="num1" placeholder="Enter first number">
    <br>

    <input type="number" id="num2" placeholder="Enter second number">
    <br>

    <button id="add">Addition</button>
    <button id="sub">Subtraction</button>
    <button id="mul">Multiplication</button>
    <button id="div">Division</button>

    <div id="result">Result will appear here</div>

</body>
</html>
