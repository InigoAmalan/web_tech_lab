<!DOCTYPE html>
<html>
<head>
    <title>Cake Shop</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        h2 {
            background-color: red;
            color: white;
            padding: 8px;
        }

        .cake {
            display: inline-block;
            margin: 10px;
        }

        .cake img {
            width: 120px;
            height: 90px;
        }

        input {
            width: 95%;
            padding: 5px;
            margin: 5px;
        }

        button {
            background-color: blue;
            color: white;
            padding: 8px 40px;
            border: none;
        }

        #total {
            color: red;
            font-size: 20px;
            font-weight: bold;
        }
    </style>

    <script>
        $(document).ready(function () {

            $("#order").click(function () {

                let color = parseInt($("#color").val()) || 0;
                let brown = parseInt($("#brown").val()) || 0;
                let milky = parseInt($("#milky").val()) || 0;
                let black = parseInt($("#black").val()) || 0;

                let total =
                    (color * 300) +
                    (brown * 200) +
                    (milky * 250) +
                    (black * 350);

                $("#total").html("Rs." + total);
            });

        });
    </script>
</head>

<body>

    <h2>CAKE SHOP</h2>

    <div class="cake">
        <img src="https://via.placeholder.com/120x90?text=Color+Cake">
        <br>
        Color Cake - Rs.300
    </div>

    <div class="cake">
        <img src="https://via.placeholder.com/120x90?text=Brown+Cake">
        <br>
        Brown Cake - Rs.200
    </div>

    <div class="cake">
        <img src="https://via.placeholder.com/120x90?text=Milky+Cake">
        <br>
        Milky Cake - Rs.250
    </div>

    <div class="cake">
        <img src="https://via.placeholder.com/120x90?text=Black+Forest">
        <br>
        Black Forest - Rs.350
    </div>

    <h2 style="background:white;color:blue;">
        Order Cake
    </h2>

    Color Cake Quantity:
    <input type="text" id="color" value="2">

    Brown Cake Quantity:
    <input type="text" id="brown" value="1">

    Milky Cake Quantity:
    <input type="text" id="milky" value="2">

    Black Forest Cake Quantity:
    <input type="text" id="black" value="1">

    <br>

    <button id="order">Place Order</button>

    <h3>Purchase Order Bill!!</h3>

    <div id="total">Total Price</div>

</body>
</html>
