<!DOCTYPE html>
<html>
<head>
    <title>Student Details</title>
</head>

<body>

    <h3>URK24CS1128</h3>

    <h1>Student Details</h1>

    <div id="output"></div>

    <script>

        // Create an array of student objects
        var students = [

            {
                name: "John",
                r_num: "UR13CS129",
                dob: "20-apr-1995"
            },

            {
                name: "Joseph",
                r_num: "UR13CS130",
                dob: "05-jan-1998"
            },

            {
                name: "David",
                r_num: "UR13CS131",
                dob: "15-jun-2002"
            },

            {
                name: "Sarah",
                r_num: "UR13CS132",
                dob: "10-mar-2001"
            }

        ];

        // Create empty result
        var result = "";

        // Iterate through students
        for (var i = 0; i < students.length; i++) {

            // Display student name and register number
            result += "<p>";

            result += students[i].name +
                      "'s Register Number is " +
                      students[i].r_num;

            result += "<br>";

            // Get year of birth
            var year = new Date(students[i].dob).getFullYear();

            // Check whether birth year is before or after 2000
            if (year < 2000) {

                result += "Category: Born before 2000";

            }
            else {

                result += "Category: Born after 2000";

            }

            result += "</p>";

        }

        // Display result on webpage
        document.getElementById("output").innerHTML = result;

    </script>

</body>
</html>
